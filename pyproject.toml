[project]
name = "structured-infrastructure-manager"
version = "0.1.0"
description = "Enterprise structured cabling and physical infrastructure source of truth"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<0.129",
  "httpx>=0.28,<0.29",
  "PyJWT[crypto]>=2.10,<3",
  "uvicorn[standard]>=0.48,<0.49",
  "sqlalchemy>=2.0.50,<2.1",
  "alembic>=1.18,<1.19",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.12,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "qrcode>=8,<9"
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<0.15"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "tests/fiber"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools]
packages = []
